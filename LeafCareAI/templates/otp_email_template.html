<!DOCTYPE html>
<html>
<head>
    <title>OTP Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            text-align: center;
        }
        .container {
            background-color: #8bec306d;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
            display: inline-block;
        }
        h2 {
            color: #333;
        }
        p {
            font-size: 16px;
            color: #555;
        }
        .otp {
            font-size: 22px;
            font-weight: bold;
            color: #e63946;
            padding: 10px;
            border: 2px dashed #e63946;
            display: inline-block;
            margin-top: 10px;
        }
        .footer {
            margin-top: 20px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>OTP Verification</h2>
        <p>Dear {{ name }},</p>
        <p>Your One-Time Password (OTP) for verification is:</p>
        <div class="otp">{{ otp }}</div>
        <p>This OTP is valid for only 10 minutes. Do not share it with anyone.</p>
        <p>If you did not request this, please ignore this email.</p>
        <div class="footer">© 2025 LeafCare AI. All rights reserved.</div>
    </div>
</body>
</html>
